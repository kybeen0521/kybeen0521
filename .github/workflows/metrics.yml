name: generate metrics

on:
  # refresh twice a day
  schedule:
    - cron: "0 */12 * * *"
  # allow manual runs from the Actions tab
  workflow_dispatch:
  # regenerate on push to main (token commits don't re-trigger workflows,
  # so the metrics.svg self-commit won't cause a loop)
  push:
    branches:
      - main

# metrics commits the generated SVG back to the repo
permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: languages (full + recent) + isocalendar
        uses: lowlighter/metrics@latest
        with:
          # classic PAT (repo + read:user), stored as the METRICS_TOKEN secret,
          # needed for cross-repo / private language stats and recent-commit analysis
          token: ${{ secrets.METRICS_TOKEN }}
          user: kybeen0521
          filename: metrics.svg
          template: classic
          base: header, activity
          config_timezone: Asia/Seoul

          # --- Languages: all-time breakdown (populated via METRICS_TOKEN) ---
          # NB: recently-used / indepth analysis fails in this environment
          # (consistent ~51s error), so it is intentionally left out.
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_colors: github

          # --- Isocalendar: 1-year contribution heatmap ---
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
